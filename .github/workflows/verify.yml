# GAIA Foundation verification (research tooling only; no build, no deployment, no secrets).
# Runs on pull requests, on pushes to research/* branches, and on manual dispatch.
# Checks: every MANIFEST.sha256, the gaia_tools pytest suite, and both validators.
# Read-only: the job has contents:read permission and writes nothing back to the repository.
# Status: Proposed with GOVERNANCE/AUDIT_UNIVERSAL_REGULATION_v2.md (UR-L3-08 / TEC-2).
name: verify

# PAUSED 2026-10-24 at Kyle's request: GitHub Actions is not available for this
# private repo without billing, so automatic runs only produced failure alerts.
# The same checks run locally before every push. To re-enable, restore:
#   pull_request:
#   push: { branches: ['research/**'] }
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Manifests (sha256sum --check on every MANIFEST.sha256)
        run: bash .github/scripts/check_manifests.sh .

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install research tooling dependencies
        working-directory: Research/tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip freeze > "$RUNNER_TEMP/pip-freeze.txt"
          cat "$RUNNER_TEMP/pip-freeze.txt"

      - name: gaia_tools tests (pytest)
        working-directory: Research/tools
        run: python -m pytest -q tests

      - name: Validator (cycles)
        working-directory: Research/tools
        run: |
          python -m gaia_tools.validate .. --out "$RUNNER_TEMP/validate.json"
          python - <<'PY'
          import json, os, sys
          d = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "validate.json")))
          print("errors:", d.get("n_errors"), "warnings:", d.get("n_warnings"))
          sys.exit(1 if d.get("n_errors", 1) != 0 else 0)
          PY

      - name: Validator (tracks)
        working-directory: Research/tools
        run: python -m gaia_tools.tracks validate ..
